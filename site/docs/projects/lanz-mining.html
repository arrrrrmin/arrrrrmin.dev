  <script id="3" type="text/markdown">
    [Lanz Mining](https://media.ccc.de/v/gpn23-213-lanzmining-wer-spricht-denn-da-) was my first data project and it’s original idea came from a friend who asked me if he’s the only one having the impression that the same people are talking in talkshows all the time. This was the start for everything I scraped data from public broadcast television media stores using classic web scraping at first and pivoted to [Obsidian Web Clipper](https://obsidian.md/clipper).

    With a bit of data processing and some analysis I got a good overview over the German talkshow landscape and indeed my friend was mostly right, a large proportion of guests does only appear 1-2 times over the span almost 2 years, while a very few made it up to 16 times into the five talkshow formats analysed.

    There is a small website that I did along side the [talk I held in Karlsruhe at the 2025 GPN](https://media.ccc.de/v/gpn23-213-lanzmining-wer-spricht-denn-da-). Feel free to explore the data at [lanz-mining.arrrrrmin.dev](https://lanz-mining.arrrrrmin.dev). Since this is a Germany scoped project I didn’t really bother to translate it, although this would be a good idea to make it more accessible for English speaking Germans and people that live in this country.
  </script>

    The people at Borgnetzwerk are currently the ones that push the topic further and got the capabilities to collect, analyse and store data at wikidata project level. Over 2026 they collected tons of data and turn it into linked data. Something I wanted to achive with the project and since these are professionals on this topic I support them when ever I get to it. In the end linked data is crowed sourced, reliable and queryable, which is all I hoped for.
