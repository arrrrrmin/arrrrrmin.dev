  <script id="7" type="text/markdown">
    ## The idea

    Since I like to consume [ARTE](https://arte.tv) (a German-French cooperative public broadcasting TV station), I noticed that there is a lot of potential to one of their formats for a DataVis. The format is called _With Open Maps_ translated from the German original _Mit offenen Karten_ where _Karten_ can mean a game card or map. It's available in German, French and Polish and covers certain geo-political aspects each episode. A usual episode ranges between 12 to 20 minutes of video time. Here's a random example of what such an episode can look like, in this case it's about gun violence in Brazil and the episodes title [_From Bolsonaro to Lula: Where is Brazil heading?_](https://www.arte.tv/de/videos/125533-026-A/mit-offenen-karten/)

    ![A map of southamerica provided by the ARTE fromat "with open maps", showing Brazil yellow coloured, venezuela in red and argentina in blue. Images of Luiz Inácio Lula da Silva, Javier Milei and an image of fifth January 2026 event where Nicolás Maduro was taken arrested in USA military intervention, show the political context surrounding Brazil.](./images/ARTE-open-maps-example-brazil-2025-05-30.png)

    > **💡** Why not make a map of their maps?

    Like some metadata map, where you can find episodes linked to geolocations and coocuring locations inside an episode. This way we could navigate their geopolitical coverage on a map.

  </script>
  <script id="8" type="text/markdown">
    ## Data landscape

    Since ARTE is a public broadcasting TV station open to everyone, I don't need to click an account or pass any paywalls. To link episodes to regions of interests (ROIs), we need to find out which episode concerns which region. Inspecting metadata of each page tells us that each episode comes with a description tag, which does exactly that. For the scope of the map we need to decide, do we want to:
    1. Present each and every mentioned region, city, river, ...
    2. or do we want to navigate the geo-political context?

    I want to go with the second option. The latter would require to label locations manually. Making the map fine-granular would make it visually overloaded and it doesn't really serve the navigation purposes of a geopolitical format which in most cases will at some point be interstate/intercontinental. Also transcribing each and every episode is tidious and AI transcripts are still to flawed for a data correctness goal of > 90%. 90 sounds much but it’s not. 10% errors is much to correct by hand. For this project I'd like to have as much _correct_ or at least reasonable data as possible.
  </script>

  <script id="12" type="text/markdown">
    ## Geocoding
    But as you can see we got no geo locations at this point. Which means we need to find them. I used SpaCy a natural language processing (NLP) toolkit in Python. SpaCy provides you with pretrained german Name Entity Recognition (NER) models. NER models are simple that try to recognise if a word is a place, person, org or something else. The large version I use here is 610MB large and easily fits a Docker container on lambda or any other serverless service.

    As soon as we extracted potential location names from `title`, `subtitle` and `description` we can go ahead and take these words that may correspond to geolocations and ask a geocoding service like Open Streetmap - Nominatim.
    Since we don’t want to annoy the OS infrastructure with unneeded questioning we can set up a cache, where we note each word as a key every time Nominatim responds with “not found”.
  </script>

    Before we go straight ahead to build the map, I'd like to take a little time to give an overview over the coverage.
    Over the ${episodesTotal} episodes in the dataset we got two types of episodes either long ones or short narrowly scoped episodes.
    The shorter ones are a subformat inside _With open maps_ and are called _In focus_. These are usually around 4-5 minutes in length and care more about recent events, while the longer episodes are around 12 minutes in length and sometimes come with literature recommendations regarding the episodes topic. Giving recommendations on literature is a feature I don’t usually follow up on, but I really like it, because it takes me serious as a viewer. It doesn’t tell me _that’s enough for you_, it tells me _if you want to go further here is where_.
    For this analysis I excluded the short versions.

  <script id="32" type="module">
    function bubbleMap (width) {
      const numEpisodes = (d) => d.program_ids.length;
      const radiusRange = width > 550 ? [1, 24] : [1, 16]
      const radius = d3.scaleSqrt([0, d3.max(places, numEpisodes)], radiusRange);
      const height = parseInt(width / 2);

      const projection = d3.geoEquirectangular().fitSize([width, height], countries);
      const path = d3.geoPath().projection(projection);
      const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("style", "width: 100%; height: auto; height: intrinsic;");

      const point = (d) => projection([d.coordinates.lon, d.coordinates.lat]);

      svg.append("path")
        .datum(countries)
        .attr("fill", "#ddd")
        .attr("stroke", "#ccc")
        .attr("d", path);

      const legend = svg.append("g")
        .attr("fill", "#777")
        .attr("transform", `translate(${width-30},${height-10})`)
        .attr("text-anchor", "middle")
        .style("font", "10px sans-serif")
        .selectAll()
          .data(radius.ticks(3).slice(1))
          .join("g");

      legend.append("circle")
        .attr("fill", "none")
        .attr("stroke", arteRed)
        .attr("cy", d => -radius(d))
        .attr("r", radius);

      legend.append("text")
          .attr("y", d => -2 * radius(d))
          .attr("dy", "1em")
          .text(radius.tickFormat(4, "s"));

      const circleContainer = svg.append("g")
        .attr("fill", arteRed)
        .attr("fill-opacity", 0.5)
        .attr("stroke", "#fff")
        .attr("stroke-width", 0.5)

      svg.append("g").attr("id", "tip")
        .attr("transform", `translate(${0}, ${height - 28})`)
        .style("pointer-events", "none")
        .append("text");

      circleContainer.selectAll()
        .data(places)
        .join("circle")
          .attr("transform", d => `translate(${point(d)[0]}, ${point(d)[1]})`)
          .attr("r", d => radius(numEpisodes(d)))
          .on("pointerenter", function (e, d){
            const numEps = numEpisodes(d);
            const label = numEps > 1 ? "episodes" : "episode";
            const tspans =  [`${d.place}`, `adressed in ${numEpisodes(d)} ${label}`];
            //svg.select("g#tip").attr("transform", `translate(${point(d)[0]}, ${point(d)[1]})`)
            svg.select("g#tip text")
              .selectAll("tspan")
              .data(tspans)
              .join("tspan")
              .attr("x", 0)
              .attr("dy", (d, i) => i === 0 ? "0em" : "1.2em")
              .attr("font-size", 14)
              .attr("font-family", "var(--sans-serif)")
              .text(d => d)
          })
          .on("pointerleave", function (e, d){
            svg.selectAll("g#tip text tspan").text("")
          })
          .append("title")
          .text(d => `${d.place} Episodes ${numEpisodes(d)}`);

      return svg.node();
    }
  </script>

  <script id="46" type="module">
    async function ArteMap(data, cmap) {
      let land = topojson.feature(cmap, cmap.objects.land);
      let countries = topojson.feature(cmap, cmap.objects.countries);

      const svg = d3.create("svg")
        .attr("id", "map-content")
        .attr("overflow", "hidden")
        .attr("style", "background-color: #eee; border-radius: 11px;");

      const root = svg.append("g");
      const g = { basemap: root.append("g"), dots: root.append("g") }

      function zoomed(event) {
        const { transform } = event;
        root.attr("transform", transform);
      }
      const zooming = d3.zoom()
        .scaleExtent([1, 10])
        .on("zoom", zoomed);

      const radiusScale = d3.scaleLinear()
        .domain([1, d3.max(Object.values(data.places), (d) => d.program_ids.length)])
        .range([1, 12])

      svg.call(zooming);

      function render({ source, related, width, height }) {
        svg.attr("viewBox", [0, 0, width, height])

        // Projection updates through width on resize
        const projection = d3.geoEqualEarth()
          .translate([width / 2, height / 2]);

        function zoomingCenterOn({ lon, lat }, k = 2) {
            const [x, y] = projection([lon, lat]);

            const transform = d3.zoomIdentity
              .translate(width / 2, height / 2)
              .scale(k)
              .translate(-x, -y);

            svg.transition()
              .duration(700)
              // Fires "zoom" event which in turn calls zoomed
              .call(zooming.transform, transform);
        }

        const path = d3.geoPath().projection(projection);

        const link = d3.line()
          .x(d => projection([d.lon, d.lat])[0])
          .y(d => projection([d.lon, d.lat])[1])
          .curve(d3.curveBundle.beta(0.9));

        g.basemap.selectAll("path.land")
          .data([land])
          .join("path")
          .attr("class", "land")
          .attr("d", path);

        g.basemap.selectAll("path.country-interior")
          .data([countries])
          .join("path")
          .attr("class", "country-interior")
          .attr("d", path);

        function checkHightlight(name) {
          let className = "location";
          if (name === source.name || related.filter((r) => r.name === name).length > 0) {
              className = "location-highlight";
          }
          return className;
        }

        const t = svg.transition().duration(700).ease(d3.easeCubic);

        const circleData = Object.entries(data.places).map(
            ([key, values]) => {
              return ({
                title: key,
                r: radiusScale(values.program_ids.length),
                xy: projection([values.coordinates.lon, values.coordinates.lat])
              })
            }
        );

        g.dots.selectAll("circle")
          .data(circleData)
          .join(
            (enter) => enter.append("circle")
              .attr("class", ({ title }) => checkHightlight(title))
              .attr("title", ({ title }) => title)
              .transition(t)
              .attr("r", ({ title, r }) => checkHightlight(title).includes("highlight") ? r : 1)
              .attr("cx", ({ xy }) => xy[0])
              .attr("cy", ({ xy }) => xy[1]),
            (update) => update
              .attr("class", ({ title }) => checkHightlight(title))
              .attr("title", ({ title }) => title)
              .attr("r", 1)
              .transition(t)
              .attr("r", ({ title, r }) => checkHightlight(title).includes("highlight") ? r : 1)
              .attr("cx", ({ xy }) => xy[0])
              .attr("cy", ({ xy }) => xy[1]),
            (exit) => exit
          )

        g.dots.selectAll("path.link")
          .data(related.map(target => [source.coordinates, target.coordinates]))
          .join("path")
          .attr("class", "link")
          .attr("stroke", arteRed)
          .attr("stroke-opacity", 0.85)
          .attr("d", link)

        const labelsData = [source, ...related].map(
          (d) => ({ ...circleData.find(c => c.title === d.name) })
        )
        g.dots.selectAll("text.label")
          .data(labelsData)
          .join(
              (enter) => {
                enter.append("text")
                  .attr("class", "label")
                  .attr("x", d => d.xy[0])
                  .attr("y", d => d.xy[1])
                  .attr("dy", 0)
                  .transition(t)
                  .delay(350)
                  .attr("font-size", 8)
                  .attr("font-weigth", 600)
                  .attr("dy", d => -(d.r + 1))
                  .attr("text-anchor", "middle")
                  .text(d => d.title)
              },
              (update) => {
                update.attr("x", d => d.xy[0])
                  .attr("y", d => d.xy[1])
                  .attr("dy", 0)
                  .transition(t)
                  .delay(350)
                  .attr("dy", d => -(d.r + 1))
                  .text(d => d.title)
              },
              (exit) => {
                exit.transition()
                  .duration(350)
                  .remove()
              }
          )

        zoomingCenterOn(source.coordinates);

        return svg.node();
      }
      return { render };
    }
  </script>

  <script id="50" type="module">
    function filterEpisodes(name) {
      return data.episodes.filter(episode => episode.places.filter(
        (gl) => gl.name === name).length > 0
      )
    }

    function findRelatedLocations(name) {
      const episodes = filterEpisodes(name);
      const source = episodes.map(episode => episode.places).flat().filter(p => p.name === name)[0]
      const related = episodes.map(episode => episode.places).flat().filter(p => p.name !== name);
      return { episodes, related, source }
    }

    const {episodes, related, source} = findRelatedLocations(locationName);

  <script id="59" type="text/x-typescript">
    function renderResultEpisodes (episodes) {
      const formatDate = (date) => formatTime(new Date(date));
      const episodesSorted = episodes.sort(
        (a, b) => new Date(b.available_from) - new Date(a.available_from)
      );
      const containers = episodesSorted.map(e => html`<div class="card result-card">
          <h3><a href="${e.source}" target="_blank">${e.title} - ${e.subtitle}</a></h3>
          <div><span>${formatDate(e.available_from)}</span> - <span>${formatDate(e.available_until)}</span></div>
          <div><p class="truncated" title="${e.description}">${e.description}</p></div>
          <div class="preview"><img src="${e.image_url}" /></div>
        </div>`
      );
      return html`<div class="arte-result-container" style="margin:0;">
        ${containers}
      </div>`
    }

    display(renderResultEpisodes(episodes))
  </script>
