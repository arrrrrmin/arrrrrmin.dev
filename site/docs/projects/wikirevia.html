  <script id="2" type="text/markdown">
    [Wikirevia](https://wikirevia.arrrrrmin.dev) is a work in reflection. After in Germany we had a Constitutional Court judge election debacle over the person of Frauke Brosius-Gersdorf, Journalists spotted an interesting amount of Wikipedia article edits where certain personal shaped the tone of Dr. Brosius-Gersdorf’s article ([Target wikipedia edits to Brosius-Gersdorf’s article](https://www.t-online.de/nachrichten/deutschland/innenpolitik/id_100821052/brosius-gersdorf-wikipedia-eintrag-wurde-gezielt-geaendert.html)). The debacle where far right parlament members have flasly occused her of plagiasm and conservatives in part followed their argument to avoid her as a newly elected judge, was shocking to many Germans.

    This is why I build this tool to search for revisions, edit frequencies and accounts, to spot such behaviour faster, as the far right will use every tool at it’s disposal to manipulate the publics perception.
