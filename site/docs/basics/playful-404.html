  <script id="1" type="text/markdown">
    I was thinking about animation and data recently. But in contrast to css animations which mostly are repeated in loops I’m more interested in how d3’s transitions can behave like animations. Basics are documented by Mike Bostock in [d3 general update pattern](https://observablehq.com/@d3/general-update-pattern). For this little experiment I wanted to play with a little 404 page I call it __Lost in data__.

    [_I won't read it anyways, get me to the chart directly please_](#the-visual)

    A bar chart where a single bar is a square-like looking emoji, which’s eyes are always looking up to the highest bar next to it, either left or right. To realize it we generate a random bars:
  </script>
  <script id="5" type="module" pinned="">
    // Bounds for each random bar
    const [min, max] = [0, 100];
    // 404 unique values, but any number > 150 will do reliably.
    const settings = {
        count: 150,
        min,
        max,
        // Some random integer function
        random: d3.randomInt,
        // Another random int function for the emoji location
        location: d3.randomInt
    }
    // Actually generate data bins and emoji location
    function getData() {
      const random_data = Float64Array.from(
        { length: settings.count },
        settings.random(settings.min, settings.max)
      );
      const nbins = 12;
      const bins = d3
        .bin()
        .thresholds(d3.range(0, settings.max, settings.max / nbins))(random_data);
      const location = Float64Array.from(
        { length: 1 },
        settings.location(1, bins.length - 1)
      )[0];
      return { bins, location };
    }
  </script>
  <script id="287" type="text/markdown">
    Next we need our _fixed_ emoji bar that will move to different locations everytime we update the base data. We can create it as a simple svg and prototype/svg-export it from Figma. In Observable Notebooks 2.0 we only need to give it a variable which we’ll later us like so ``
  </script>
  <script id="125" type="module" pinned="">
    // Build a simple emoji in figma, copy the svg code and paste it here
    // Rects with `class="eye"` are important later, so we can select these
    // and change position
    const emojiPath = `<svg width="100" height="100" viewBox="0 0 100 100" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="10" fill="black"/>
    <rect x="23" y="68" width="60" height="10" rx="3" fill="white"/>
    <rect x="22" y="24" width="20" height="20" rx="3" fill="white"/>
    <rect class="eye" x="32" y="26" width="8" height="8" rx="3" fill="black"/>
    <rect x="63" y="24" width="20" height="20" rx="3" fill="white"/>
    <rect class="eye" x="73" y="26" width="8" height="8" rx="3" fill="black"/>
    </svg>
    `
    // Parse from string with a content type image/svg+xml
    const emojiTemp = new DOMParser()
      .parseFromString(emojiPath, "image/svg+xml").documentElement;

    // Return a deep copy so we can use it in multiple cells
    function parseEmoji() {
      return document.importNode(emojiTemp, true);
    }
    const emoji = parseEmoji();
  </script>
  <script id="286" type="text/markdown">
    With our data and the emoji ready we can now build a simple chart like we would usually do in d3js and set some appropriate attributes – it doesn’t need to be a lot:
  </script>

      .attr("width", 100)

    example.append("g").node().appendChild(parseEmoji());
  </script>

  <script id="288" type="text/markdown">
    The real challenge kicks in with the render function that needs to depend on the updateable data with `getData`. Ideally we recompute the chart every time we have new data (some trigger/button we define later).
    In Notebooks we can do the following pattern:
    ```js
    function Chart() {
      // Init svg and inject the emoji svg

      function render(width, data) {
        // Handle everything related to data and follow
        // the general update pattern using `enter`, `update`, `exit`.
        // Remember the `width` variable this function recieves
        // comes from Notebooks and relates to the containers width.
      }
    };
    // I like to do the following to init the chart we’ll update:
    const vis = ({
      chart: Chart()
    })
    // Call it like so, where `width` is a result of notebooks ResizeObserver
    // and `update` is our trigger we don’t have yet.
    vis.chart.render(width, update)
    ```
    Two important parts here: (1) `width` comes from notebooks and relates to the container, while (2) we want to use `enter`, `update` and `exit` to handle data changes – these are our transition designs. For the details see [Appendix](#appendix)
  </script>
  <script id="295" type="text/markdown">
    Regarding the transitions I like to set a uniform speed and apply variations from this variables:

    ```js
    function render(width, data) {
      // Compute height corresponding to width
      // Prepare bar chart scales
      // ...
      const t = svg.transition().duration(1000).ease(d3.easeCubic);

      // Apply the general update pattern
      svg
          .selectAll("rect.bar")
          .data(someBarData)
          .join(
            (enter) =>
              // Entering data creates a rect
              // using classes we can select these later on or apply CSS
              enter
                .append("rect")
                // Everything not related to the transition
                // “It will just be there"
                .attr("class", "bar")
                .attr("x", (b) => x(b.i))
                .attr("width", x.bandwidth())
                .attr("y", height)
                .attr("rx", 5)
                // Things that transit
                .transition(t * 0.9)
                // Rects start from the top so this will transit from
                // `height` (see 3 lines above) which is the bottom of the svg
                // to it’s actual data given location
                .attr("y", (b) => height - y(b.length - 2))
                .attr("height", (b) => y(b.length - 2) - y(0))
                .attr("fill", "black"),
            )
          .join((update) => {
            // Update related transitions
          })
          .join((exit) => {
            // Exit related transitions
            // These happen when a data point is removed and the key function return null
            // in the prior-posterior diff happening inside d3js
          })
    }
    ```

  </script>
  <script id="296" type="text/markdown">
    Again, the actually running code is inspectable in [Appendix](#appendix).

    But for our update pattern we still need a trigger and a function that moves the eyes, with respect to the surrounding data. Let’ tackle the eyes first.
  </script>
  <script id="146" type="module" pinned="" hidden="">
    function directionToLookAt(data) {
      // Get data left and right of our little friends location
      // Remember `data` in this function comes from `getData()`,
      // which returns `{bins, location}`.
      const barSizeRight = data.bins[data.location + 1].length;
      const barSizeLeft = data.bins[data.location - 1].length;
      // Select the rects with class "eye"
      const eyes = d3.select(parseEmoji()).selectAll("rect.eye")
      // Move the eye position left and right
      let eyesX = d3.map(eyes, (e) => parseFloat(d3.select(e).attr("x")));
      if (barSizeLeft > barSizeRight) {
        // Tbh I just tried is out 8 feels good.
        // Once you have this and you don't change the proportions
        // inside the SVG or play with the viewBox you'r fine
        eyesX = eyesX.map((x) => x - 8);
      }
      // Return the new eye location so we can use it
      return eyesX;
    }
  </script>
  <script id="297" type="text/markdown">
    We can use this function inside `chart.render()` and get the current data and the corresponding eye position:
    ```js
    const eyeX = directionToLookAt(data);
    svg.selectAll("rect.eye")
      .transition(t * 0.25)
      .attr("x", (_, i) => eyeX[i]);
    ```
  </script>
  <script id="298" type="text/markdown">
    Last we need a trigger so viewers can play with the chart. At this point it becomes very easy because we got (1) a function to create new data, functions to init and update the chart and a function to recompute the eye location. Now we just need to trigger all of this using an input like a button:
    ```js
    const update = view(Inputs.button("Update", {
      value: getData(),
      reduce: () => getData()
    }))
    ```

    Basically this does only hold a value as the inital state in `value` and the `reduce` to get a the result of a new execution of `getData()`. The result of `getData()` is stored in `update` in any case.
    The only thing left is to inform our visualisation about newly arrived data states with a single cell containing `vis.chart.render(width, update)`. This single cell is dependent on `width` and `update`, so if either of these recieves a new state the render function will execute again.
  </script>

  <script id="201" type="module">

  <script id="34" type="module" pinned="">
    function Chart() {
      const svg = d3.create("svg");
      const g = svg.append("g");
      g.node().appendChild(emoji);

      function render(width, data) {
        const height = width * (3 / 4);

        const x = d3
          .scaleBand(d3.range(data.bins.length), [0, width])
          .paddingInner(0.05);
        const y = d3.scaleLinear(
          [0, d3.max(data.bins.map((b) => b.length - 2))], [0, height]
        );

        const empty = data.bins.filter((d, i) => i === data.location)[0];

        svg
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", [0, 0, width, height]);

        const eyeX = directionToLookAt(data);

        const t = svg.transition().duration(1000).ease(d3.easeCubic);

        g.selectAll("svg")
          .attr("width", x.bandwidth())
          .attr("height", x.bandwidth())
          .attr("rx", 5);

        // Only on initial load we already define the x location
        // This way our rect-moji drops in the right location, without moving across the svg
        if (svg.selectAll("rect.bar")._groups[0].length === 0) {
          g.attr("transform", `translate(${x(data.location)}, 0)`);
        }

        g.transition(t * 0.25)
          .attr("transform", `translate(${x(data.location)}, ${height})`)
          .transition(t * 0.5)
          .attr(
            "transform",
            `translate(${x(data.location)}, ${height - x.bandwidth()})`
          )
          .selectAll("rect.eye")
          .transition(t * 0.25)
          .attr("x", (_, i) => eyeX[i]);

        svg
          .selectAll("rect.bar")
          .data(
            data.bins
              .map((b, i) => ({ length: b.length, i: i }))
              .filter((d, i) => i != data.location)
          )
          .join(
            (enter) =>
              enter
                .append("rect")
                .attr("class", "bar")
                .attr("x", (b) => x(b.i))
                .attr("width", x.bandwidth())
                .attr("y", height)
                .attr("rx", 5)
                .transition(t * 0.9)
                .attr("y", (b) => height - y(b.length - 2))
                .attr("height", (b) => y(b.length - 2) - y(0))
                .attr("fill", "black"),
            (update) =>
              update.call((update) =>
                update
                  .transition(t * 0.9)
                  .attr("x", (b) => x(b.i))
                  .attr("width", x.bandwidth())
                  .attr("y", (b) => height - y(b.length - 2))
                  .attr("height", (b) => y(b.length - 2) - y(0))
              ),
            (exit) =>
              exit.call((exit) =>
                exit
                  .transition(t * 0.9)
                  .attr("y", height)
                  .remove()
              )
          );

        return svg.node();
      }
      return { render };
    }
  </script>
