  <script id="7" type="text/markdown">
    ## Make it minimalistic

    Making it minimalistic is highly influenced by [hundred rabbits](https://100r.ca/site/home.html). A canadian two person design studio. I recently got to read their [permacomputing 101](https://100r.ca/site/permacomputing_101.html) article where they give an introduction on what it is and which principles they follow.

    Their design habbits are pretty obvious and I love it all. Minimal, mostly monochrome, simplicity over complexity and while reading you’r provided with tons of memes or side information along the way. **So I thought to myself, let's do an experiment to find intersections of UI and datavis?**

  <script id="10" type="text/markdown">
    ## Date in visuals

    Writing a blog, one of the first things one comes across is a `publishedDate`. Every blog has a publishing date and this is super trivial data. But maybe we can find a few variations to spice it up. I did this: ${trailDots(date)}, to get a bit create with the date formatting. Each dot is a month and the large one represents the month of publication, followed by a `<YY>` to indicate the year. It’s short and looks nice. But it has flaws. Try to compare the following two dates:
  </script>
  <script id="30" type="text/x-typescript">
    const comparisonTrailDots = html`
      <div>${trailDots(new Date("2025-06-01"))}</div>
      <div>${trailDots(new Date("2025-07-01"))}</div>
    `;

    display(comparisonTrailDots);
  </script>

    I still like it but there are better ways to do this. Form here on you can set a date to test out different scenarios.
  </script>

  <script id="35" type="text/markdown">
    Now we also got the day included as the top number and the year in the bottom, also the month is more easily readable with three rows. But it introduces a new flaw because it’s hard to align the numbers block with the bottom grid months (3, 6, 9, 12). It will look odd, no matter if we align it to either the outer big circle or the small circles bottom edge, as soon as our dates month hits the bottom numbers.

    Another inconvenience is the size, since the grid won’t fit a common line height for inline usage. Here is a variation that can handle both:

    ${blockDotsEqual(date)}
  </script>

  <script id="23" type="text/markdown">
    | Experiment | Note |
    | --- | --- |
    | ${trailDots(dateTable)} | Throws away the day, fine situationally. Fits inline situations. Readability is medioker for mid-year months. |
    | ${blockDots(dateTable)} | Includes date and year, increased readability with rows but hard to align with bottom months 3, 6, 9, and 12. |
    | ${blockDotsEqual(dateTable)} | Removes the alignment problem by equalized sizes. Further increased readability but looks less minimalistic.|
    | ${blockDotsEqual6(dateTable)} | Adaptation with 6 columns floating months to the right. Best block readability and alignment is easy. |
    | ${clockDots(dateTable)} | Radial mapped months aren’t as easily readable and suffer from the starting problem where readers don’t know wether the first top dot corresponds to December or January.  |

    ## Ratings

    While writing alternatives like ${trailPaths(date)} I realized this is draging me into a hole where I can’t proceed with what I actually wanted to expore. Different versions of UI elements. So I stopped doing more of these variations and asked myself what standard trivial elements come to mind which are less bloggy: **ratings**.

  <script id="51" type="text/x-typescript">
    const getData = (r) => Array.from({length: maxRating5}).map((d, i) => ({i, rated: i < r}));

    const ratingBlocks = (rating) => {
      const [w, h] = [50, 50];
      const minHeight = 6;
      const rx = 2;
      const data = getData(rating);
      const y = d3.scaleBand(data.map(({i}) => i), [h - rx, rx]).paddingInner(0.2)
      const svg = getSvg(w, h);

      svg.selectAll("rect")
        .data(data)
        .join("rect")
        .attr("x", 1)
        .attr("y", (d) => y(d.i))
        .attr("height", (d) => y.bandwidth())
        .attr("width", w - rx)
        .attr("stroke", "currentColor")
        .attr("fill", (d) => d.rated ? "currentColor" : "none")
        .attr("rx", rx);

      return svg.node()
    }

    const ratingRects = (rating) => {
      const [w, h] = [50, 50];
      const [minW, minH] = [5, 5]
      const data = getData(rating);
      const x = d3.scaleLinear([0, data.length-1], [minW, w/2 - 1])
      const y = d3.scaleLinear([0, data.length-1], [minH, h/2 - 1])
      const svg = getSvg(w, h);

      const offset = (d) => data.length - (d.i)

      svg.selectAll("rect")
        .data(data.reverse())
        .join("rect")
        .attr("x", (d) => w/2 - x(d.i))
        .attr("y", (d) => h/2 - y(d.i))
        .attr("width", (d) => x(d.i)*2)
        .attr("height", (d) => y(d.i)*2)
        .attr("stroke", (d) => (d.i + 1)  < rating ? "white": "currentColor")
        .attr("fill", (d) => d.rated ? "currentColor" : "none")
        .attr("rx", 2)

      return svg.node();
    }

    const ratingCircles = (rating) => {
      const w = 50;
      const minWidth = 5;
      const data = getData(rating);
      const x = d3.scaleBand(d3.extent(data, d => d.i), [1, w-1]).paddingInner(0);
      const r = d3.scaleLinear(d3.extent(data, d => d.i), [minWidth, w/2 - 1]);
      const svg = getSvg(w, w);

      svg.selectAll("circle")
        .data(data.reverse())
        .join("circle")
        .attr("cx", (d) => w/2)
        .attr("cy", (d) => w - r(d.i) - 1)
        .attr("r", (d) => r(d.i))
        .attr("fill", (d) => d.i  < rating ? "currentColor" : "white")
        .attr("stroke", (d) => d.i + 1 < rating ? "white" : "currentColor");

      return svg.node();
    }

    const ratingTriangle = (rating) => {
      const [w, h] = [50, 50];
      const data = getData(rating);
      const step = w / data.length;
      const _data = data.reverse().map((d) => ({...d, d: [
        {x: d.i * step, y: h - 1},
        {x: d.i * step + step, y: h - 1},
        {x: w/2, y: 1},
        {x: d.i * step, y: h - 1}
      ]}));

      const svg = getSvg(w, h);
      const path = d3.line()
        .x((d) => d.x)
        .y((d) => d.y)

      svg.append("g")
        .selectAll("path")
        .data(_data)
        .join("path")
        .attr("fill", (d) => (d.i + 1) <= rating ? "currentColor": "none")
        .attr("stroke", (d) => (d.i + 1) < rating ? "white": "currentColor")
        .attr("d", (d) => path(d.d))

      svg.append("g")
        .datum([
          {x: 1, y: h - 1},
          {x: w, y: h - 1},
          {x: w/2, y: 1},
          {x: 1, y: h - 1},
        ])
        .append("path")
        .attr("fill", "none")
        .attr("stroke", "currentColor")
        .attr("d", path)

      return svg.node();
    }
  </script>
  <script id="17" type="text/x-typescript" hidden="">

  <script id="18" type="text/x-typescript">
    const blockDots = (pubDate) => {
      const [w, h] = [50, 28];
      const margin = rMax;
      const cols = Array.from({length: 4}).map((_, i) => i);
      const rows = Array.from({length: 3}).map((_, i) => i);
      const spacingX = (w - margin * 2) / cols.length;
      const spacingY = (h - margin * 2) / rows.length;
      const x = d3.scaleBand(cols, [margin, w-margin]).paddingOuter(0).paddingInner(spacingX);
      const y = d3.scaleBand(rows, [margin, h-margin]).paddingOuter(0).paddingInner(spacingY);

      const svg = getSvg(w, h).attr("class", "block-dots").style("margin-right", `${margin}px`);

      const cx = (i) => x(Math.floor(i / 3));
      const cy = (i) => y(i % 3);

      svg.append("g").selectAll("circle")
        .data(MONTHS)
        .join("circle")
        .attr("cx", cx)
        .attr("cy", cy)
        .attr("r", d => r(d, pubDate))

      const year = String(pubDate.getFullYear()).slice(2, 4);
      const day = pubDate.getDate();

      return html`
        <div style="display: inline-flex; align-items: center; vertical-align: middle; font-size: 13px; font-family: var(--monospace);">

            <span style="line-height: 1em">${day}</span>
            <span style="line-height: 1em">${year}</span>
          </div>
        </div>`;
    }

      const y = d3.scaleBand(rows, [margin, h-margin]).paddingOuter(0.2).paddingInner(spacingY);

      const svg = getSvg(w, h).attr("class", "block-dots").style("margin-right", `${margin}px`);

      let cx = (i) => x(Math.floor(i / 3));
      let cy = (i) => y(i % 3);

            <span style="line-height: 1em">${day}</span>

          </div>

    }

    const blockDotsEqual6 = (pubDate, stacking = 0) => {
      console.log(stacking);
      const strokeWidth = 1;
      const margin = rMax + strokeWidth;
      const [w, h] = [50 + (20 * (1 - stacking)), 28];
      const cols = Array.from({length: 6}).map((_, i) => i);

      const svg = getSvg(w, h).attr("class", "block-dots").style("margin-right", `${Math.floor(margin / 2)}px`);

      svg.append("g").selectAll("circle")

      const year = String(pubDate.getFullYear()).slice(2, 4);

      return html`
        <div style="display: inline-flex; align-items: center; vertical-align: middle; font-size: 13px; font-family: var(--monospace);">

  <script id="22" type="text/x-typescript">
    const clockDots = (pubDate) => {
      const w = 50;
      const h = w;
      const margin = rMax;

      const points = MONTHS.map((i) => {
        const angle = (2 * Math.PI * i) / MONTHS.length - Math.PI / -6;
        const [x, y] = d3.pointRadial(angle, w/2 - margin);
        return {month: i, x: w / 2 + x, y: w / 2 + y};
      });

      const svg = getSvg(w, h).attr("class", "block-dots");

      svg.selectAll("circle")
        .data(points)
        .join("circle")
        .attr("cx", (d) => d.x)
        .attr("cy", (d) => d.y)
        .attr("r", (d) => r(d.month, pubDate))

      const year = String(pubDate.getFullYear()).slice(2, 4);
      const day = pubDate.getDate();

      svg.append("g").attr("transform", `translate(${w/2}, ${w/2})`)
        .append("text")
        .attr("text-anchor", "middle")
        .selectAll("tspan")
        .data([day, year])
        .join("tspan")
        .attr("x", 0)
        .attr("y", 0)
        .attr("dy", (_, i) => i === 0 ? -2 : 10)
        .text(d => d)

      return html`
        <div style="display: inline-flex; align-items: center; vertical-align: middle; font-size: 13px; font-family: var(--monospace);">
          ${svg.node()}
          </div>
        </div>`;
    }
  </script>
  <script id="32" type="text/x-typescript">
    const trailPaths = (pubDate) => {
      const [w, h] = [100, 14];
      const [strokeWidthMin, strokeWidthMax] = [1, 3];
      const marginsX = strokeWidthMax / 2;
      const x = d3.scaleBand(MONTHS, [marginsX, w - marginsX]);

      const svg = getSvg(w, h).attr("class", "trail-dots");

      const path = d3.line()
        .x((d) => x(d.x))
        .y((d) => d.y)

      const data = MONTHS.map(d => ([{x: d, y: 0}, {x: d, y: h}]))
      const strokeWidth = (d) => pubDate.getMonth() === d[0].x ? strokeWidthMax : strokeWidthMin;

      svg.selectAll("path")
        .data(data)
        .join("path")
        .attr("fill", "none")
        .attr("stroke", "currentColor")
        .attr("stroke-width", strokeWidth)
        .attr("d", path)

      const year = String(pubDate.getFullYear()).slice(2, 4)

      return html`<span style="display: inline-block; vertical-align: middle; font-size: 13px; font-family: var(--monospace);">${svg.node()}/${year}</span>`;
    };
  </script>
